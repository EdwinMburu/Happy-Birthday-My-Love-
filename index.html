<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liora ❤️ - Private Access</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Liora <span class="heart">❤️</span></h1>
            <p style="text-align: center; color: #64748b; margin-bottom: 2rem;">A little world made just for you…</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">Enter</button>
            </form>
            
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <script type="module">
        import { checkPassword, setLoggedIn } from './js/auth.js';

        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = passwordInput.value;

            if (checkPassword(password)) {
                setLoggedIn();
                window.location.href = 'home.html';
            } else {
                errorMessage.textContent = 'Wrong password. Try again! 💔';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
